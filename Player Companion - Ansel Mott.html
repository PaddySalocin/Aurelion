<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#17140f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ansel Mott — Field Rig</title>
<style>
:root{
  --bg:#17140f; --panel:#211c16; --panel2:#2a241c; --line:#3a3128;
  --amber:#e8a33d; --amber-dim:#8a622a; --cold:#7fd4e8; --warn:#d4553a;
  --hp:#e8836b; --good:#7bbf6a;
   --text:#e6ddcf; --dim:#9a8f7e; --faint:#6b6255;
  --glow:rgba(232,163,61,.4);
  --rail:56px; --tabs:62px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:15px;line-height:1.45;
  padding-top:env(safe-area-inset-top);
}
#app{display:flex;flex-direction:column;height:100%}

/* ---- masthead ---- */
header{
  padding:10px 14px 8px;border-bottom:1px solid var(--line);
  background:var(--panel);flex:0 0 auto;
}
.who{display:flex;align-items:baseline;gap:9px}
.who h1{margin:0;font-size:1.02rem;font-weight:650;letter-spacing:.01em}
.who .cls{font-size:.72rem;color:var(--dim)}
.who .rank{margin-left:auto;font-family:var(--mono);font-size:.72rem;color:var(--amber)}
.hbtn{background:none;border:0;padding:0 0 0 11px;font-size:1.02rem;line-height:1;
  color:var(--dim);cursor:pointer;flex:0 0 auto}
.hbtn:active{color:var(--amber)}

/* ---- TP rail: the thing you watch ---- */

.pips{display:flex;gap:3px;margin-top:7px}
.pip{
  flex:1 1 0;height:15px;border-radius:1px;background:var(--panel2);
  border:1px solid var(--line);transition:background .13s,border-color .13s;
}
.pip.on{background:var(--amber);border-color:var(--amber);box-shadow:0 0 11px var(--glow)}
.pip.spent{background:var(--bg);border-color:var(--line)}


/* ---- vitals ---- */
.xprow{display:flex;align-items:center;gap:10px;background:var(--panel);
  border:1px solid var(--line);padding:9px 13px;margin-top:8px}
.xprow .k{font-size:.72rem;color:var(--dim);flex:1}
.xprow input{width:96px;text-align:right;padding:6px 8px;font-size:.95rem}
.trks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button.wide{display:block;width:100%;margin-top:8px;padding:13px;text-align:center}
.trk{display:flex;align-items:center;gap:6px;padding:12px 8px;background:var(--panel);
  border:1px solid var(--line)}
.trk button{width:38px;height:38px;flex:0 0 auto;border-radius:50%;font-size:1.2rem;
  line-height:1;padding:0;background:transparent}
.trk .minus{border-color:var(--hp);color:var(--hp)}
.trk .plus{border-color:var(--good);color:var(--good)}
.trk .minus:active{opacity:.65}
.trk .plus:active{opacity:.65}
.trk .mid{flex:1 1 auto;text-align:center;min-width:0}
.trk .lbl{font-size:.6rem;color:var(--faint);letter-spacing:.13em;text-transform:uppercase}
.trk .num{font-family:var(--mono);font-size:1.5rem;line-height:1.15;color:var(--hp);
  text-shadow:0 0 12px currentColor}
.trk.mp .num{color:var(--cold)}
.trk.tp .num{color:var(--amber)}
.trk.tp{margin-bottom:0}
.trk .num small{font-size:.98rem;color:var(--faint)}
.trk .num .temp{font-size:.86rem;color:var(--good);margin-left:5px}
.trk .calc{font-family:var(--mono);font-size:.62rem;color:var(--faint);margin-top:3px;
  display:flex;justify-content:center;align-items:baseline;gap:4px;flex-wrap:wrap}
.trk .calc .roll{color:var(--dim)} .trk .calc .plus{opacity:.55}
.trk .calc .add{color:var(--good)}
.trk .calc .src{font-family:var(--sans);font-size:.58rem;color:var(--faint)}

/* ---- character banner ---- */
.banner{position:relative;width:calc(100% + 28px);margin:-12px -14px 14px;height:320px;
  overflow:hidden;border-bottom:2px solid var(--amber);background:var(--bg)}
.banner{cursor:zoom-in}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:center 22%;filter:saturate(.85) contrast(1.05)}
.banner .fade{position:absolute;inset:0;
  background:linear-gradient(to top,var(--bg) 2%,rgba(0,0,0,.25) 46%,rgba(0,0,0,.35) 100%)}
.banner .who2{position:absolute;left:16px;right:16px;bottom:12px;pointer-events:none}
.banner .nm{font-size:1.58rem;font-weight:680;letter-spacing:-.01em;color:var(--text);
  text-shadow:0 2px 10px rgba(0,0,0,.85);line-height:1.1}
.banner .sub{font-size:.76rem;color:var(--amber);margin-top:3px;
  text-shadow:0 0 14px var(--glow);text-shadow:0 0 10px var(--glow),
  text-shadow:0 1px 6px rgba(0,0,0,.9)}
.banner .quo{font-size:.72rem;color:var(--dim);font-style:italic;margin-top:5px;
  text-shadow:0 1px 6px rgba(0,0,0,.9)}

.lb{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:60;display:none;
  align-items:center;justify-content:center;cursor:zoom-out;padding:12px}
.lb.open{display:flex}
.lb img{max-width:100%;max-height:100%;object-fit:contain}

.cfm{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:70;display:none;
  align-items:center;justify-content:center;padding:20px}
.cfm.open{display:flex}
.cfmbox{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);padding:18px}
.cfmt{font-size:1.02rem;font-weight:650}
.cfmm{font-size:.85rem;color:var(--dim);margin-top:8px;line-height:1.5}
.cfmbox .btn-row{margin-top:16px}

/* ---- palette picker ---- */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none;
  align-items:flex-end}
.ovl.open{display:flex}
.sheet{width:100%;background:var(--panel);border-top:1px solid var(--line);
  padding:14px 14px calc(16px + env(safe-area-inset-bottom));max-height:58%;overflow-y:auto}
.sheadr{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.sheadr button{padding:6px 14px;font-size:.78rem;border-color:var(--amber);color:var(--amber)}
.sheet h3{margin:0 0 3px;font-size:.98rem;font-weight:620}
.sheet p{margin:0 0 13px;font-size:.78rem;color:var(--dim)}
.pal{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;margin-bottom:7px;
  border:1px solid var(--line);background:var(--panel2);cursor:pointer;text-align:left}
.pal.on{border-color:var(--amber)}
.pal .strip{display:flex;flex:0 0 auto;border:1px solid var(--line);overflow:hidden}
.pal .strip i{display:block;width:15px;height:26px}
.pal .tone{margin-left:auto;font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);border:1px solid var(--line);padding:2px 6px}
.pal.on .tone{color:var(--amber);border-color:var(--amber-dim)}
.pal .pn{font-size:.88rem}
.pal .tick{color:var(--amber);font-size:.9rem;margin-left:8px}
.palgrp{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:14px 0 6px}
.palgrp:first-child{margin-top:0}

/* ---- body ---- */
main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 20px}
h2{font-size:.74rem;font-weight:600;color:var(--dim);margin:18px 0 8px;letter-spacing:.02em}
h2{display:flex;align-items:center;gap:9px;color:var(--cold)}
h2:after{content:'';flex:1;height:1px;background:var(--cold);opacity:.20}
h2:first-child{margin-top:2px}

.card{background:var(--panel);border:1px solid var(--line);margin-bottom:9px}
.card.pad{padding:11px 12px}

/* skill row */
.sk{--tone:var(--amber);display:flex;align-items:center;gap:11px;padding:10px 12px;cursor:pointer;
  border-bottom:1px solid var(--line)}
.sk:last-child{border-bottom:0}
.sk:active{background:var(--panel2)}
.sk .cost{
  font-family:var(--mono);color:var(--tone);width:42px;min-height:42px;flex:0 0 auto;
  border:1px solid var(--tone);background:var(--panel2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
}
.sk .cost b{font-size:1.05rem;font-weight:600;line-height:1}
.sk .cost i{font-style:normal;font-size:.48rem;letter-spacing:.12em;line-height:1;
  color:var(--tone);opacity:.6}
.sk:active .cost{background:var(--tone);color:var(--bg)}
.sk.cant .cost{background:none;color:var(--faint);border-color:var(--line)}
.sk.cant .cost i{color:var(--faint)}
.sk.cant .cost i{color:var(--faint)}
.sk.cant .cost{color:var(--faint);border-color:#3a3128}
.sk.cant .nm{color:var(--faint)}
.sk .nm{font-weight:550;font-size:.95rem}
.sk .meta{font-size:.7rem;color:var(--cold);opacity:.72;margin-top:2px}
.sk .runbonus{display:inline-block;margin-left:6px;font-family:var(--mono);font-size:.68rem;
  color:var(--bg);background:var(--amber);padding:1px 5px;opacity:1}
.sk .tier{margin-left:auto;font-family:var(--mono);font-size:.62rem;color:var(--cold);
  opacity:.6;border:1px solid var(--line);padding:2px 5px;flex:0 0 auto}

.det{padding:0 12px 11px;font-size:.83rem;color:var(--dim);display:none;border-bottom:1px solid var(--line)}
.det.open{display:block}
.det b{color:var(--text);font-weight:550}
.det .row{display:flex;gap:14px;margin-top:6px;font-family:var(--mono);font-size:.72rem;color:var(--cold);opacity:.75}

.ref{padding:11px 13px;border-bottom:1px solid var(--line)}
.ref:last-child{border-bottom:0}
.rhead{display:flex;align-items:center;gap:9px}
.rn{font-weight:600;font-size:.95rem}
.nhead .chip{margin-left:auto}
.chip{margin-left:auto;font-family:var(--mono);font-size:.6rem;color:var(--cold);
  border:1px solid var(--line);padding:3px 7px;line-height:1;flex:0 0 auto}
.rmeta{font-size:.68rem;color:var(--cold);opacity:.7;margin-top:3px}
.rbody{font-size:.85rem;color:var(--dim);margin-top:7px;line-height:1.5}
.rflav{font-size:.76rem;color:var(--faint);font-style:italic;margin-top:6px}
.ref.have{border-left:3px solid var(--amber);padding-left:10px}
.ref.locked{opacity:.55}
.own{font-family:var(--mono);font-size:.58rem;color:var(--bg);background:var(--amber);
  padding:3px 6px;line-height:1;letter-spacing:.06em;flex:0 0 auto}
.own.zero{color:var(--faint);background:none;border:1px solid var(--line)}
.ladder{display:flex;gap:4px;margin-top:8px}
.ladder span{flex:1;text-align:center;font-family:var(--mono);font-size:.6rem;
  color:var(--faint);border:1px solid var(--line);padding:4px 2px;line-height:1.3}
.ladder span b{display:block;font-size:.5rem;font-weight:400;opacity:.6;margin-bottom:2px}
.ladder span.at{color:var(--bg);background:var(--amber);border-color:var(--amber)}
.ladder span.at b{opacity:.75}

/* generic list line */
.line{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;
  border-bottom:1px solid var(--line);font-size:.87rem}
.line:last-child{border-bottom:0}
.line .l{color:var(--dim)}
.line .r{font-family:var(--mono);color:var(--cold)}
.line .r.up{color:var(--good)}

/* buttons */
button{font-family:inherit;font-size:.84rem;color:var(--text);background:var(--panel2);
  border:1px solid var(--line);padding:9px 12px;cursor:pointer}
button:active{filter:brightness(1.25)}
.btn-row{display:flex;gap:7px;margin-top:9px}
.btn-row button{flex:1}
button.amber{border-color:var(--amber-dim);color:var(--amber)}
button.warn{border-color:#5c3129;color:var(--warn)}

/* numeric input */
input[type=number],input[type=text],textarea{
  font-family:var(--mono);font-size:.94rem;color:var(--text);background:var(--panel2);
  border:1px solid var(--line);padding:8px;width:100%;
}
textarea{font-family:var(--sans);min-height:170px;line-height:1.5}
label{display:block;font-size:.66rem;color:var(--faint);margin-bottom:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}

/* target readout */
.read{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);margin-top:11px}
.read div{background:var(--panel);padding:11px 12px}
.read .k{font-size:.62rem;color:var(--faint)}
.read .n{font-family:var(--mono);font-size:1.5rem;color:var(--cold);margin-top:2px}
.read .n.hot{color:var(--amber)}
.read .n.no{color:var(--faint)}
.read .sub{font-size:.66rem;color:var(--dim);margin-top:2px}
.verdict{padding:11px 12px;border:1px solid var(--line);border-top:0;background:var(--panel);
  font-size:.84rem}
.verdict b{color:var(--amber)}

/* stat block */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line)}
.stats div{background:var(--panel);padding:8px 10px}
.stats .at{display:grid;grid-template-columns:1fr auto;column-gap:8px;align-items:baseline}
.stats .k{font-size:.72rem;color:var(--dim)}
.stats .n{font-family:var(--mono);font-size:1.24rem;text-align:right}
.stats .calc{grid-column:1/-1;font-family:var(--mono);font-size:.64rem;color:var(--faint);
  margin-top:3px;display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.stats .calc .roll{color:var(--dim)}
.stats .calc .plus{color:var(--faint);opacity:.55}
.stats .calc .add{color:var(--good)}
.stats .calc .src{color:var(--faint);font-family:var(--sans);font-size:.6rem}
.stats .calc .flat{color:var(--faint);font-family:var(--sans);font-size:.6rem}

.atk{display:grid;grid-template-columns:1fr auto;align-items:baseline;column-gap:10px;
  background:var(--panel);border:1px solid var(--amber-dim);border-left:3px solid var(--amber);
  padding:11px 13px;margin-top:8px}
.atk .k{font-size:.72rem;color:var(--amber);letter-spacing:.02em}
.atk .n{font-family:var(--mono);font-size:1.62rem;color:var(--amber);text-align:right;
  text-shadow:0 0 12px var(--glow)}
.atk .calc{grid-column:1/-1;font-family:var(--mono);font-size:.64rem;color:var(--faint);
  margin-top:3px;display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.atk .calc .roll{color:var(--dim)} .atk .calc .plus{opacity:.55}
.atk .calc .add{color:var(--good)}
.atk .calc .src{font-family:var(--sans);font-size:.6rem;color:var(--faint)}
.atk.dmg{margin-top:6px}

.runup{position:relative;background:var(--panel);border:1px solid var(--line);
  border-left:3px solid var(--line);padding:11px 13px;margin-bottom:8px}
.runup.hot{border-color:var(--amber-dim);border-left-color:var(--amber)}
.ru-l{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.ru-n{font-family:var(--mono);font-size:1.6rem;line-height:1.1;color:var(--dim);margin-top:1px}
.runup.hot .ru-n{color:var(--amber);text-shadow:0 0 12px var(--glow)}
.ru-b{font-size:.78rem;color:var(--faint);margin-top:2px}
.runup.hot .ru-b{color:var(--text)}
.ru-s{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.ru-s span{font-family:var(--mono);font-size:.6rem;color:var(--cold);opacity:.8;
  border:1px solid var(--line);padding:2px 6px}
.ru-x{position:absolute;top:11px;right:12px;padding:5px 10px;font-size:.68rem}
.tstart{display:flex;align-items:baseline;gap:9px;background:var(--panel);
  border:1px solid var(--line);padding:9px 13px;margin-bottom:8px;font-size:.72rem;
  color:var(--faint);flex-wrap:wrap}
.tstart b{font-weight:550;color:var(--cold);font-size:.78rem}

/* notes */
.note{padding:0}
.nhead{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--line)}
.nx{margin-left:0;padding:3px 9px;font-size:.9rem;line-height:1;border-color:var(--line);color:var(--faint)}
.nbody{padding:12px 13px;font-size:.88rem;color:var(--dim);line-height:1.55;white-space:pre-wrap}
.sketch{width:100%;display:block;cursor:zoom-in}
.padwrap{border:1px solid var(--line);background:var(--panel2);margin-top:4px}
#pad{width:100%;height:auto;display:block;touch-action:none;cursor:crosshair}

/* collapsible + link card */
.fold{display:flex;align-items:center;justify-content:space-between;padding:12px 13px;
  cursor:pointer;font-size:.88rem;font-weight:550}
.fold .car{font-family:var(--mono);color:var(--amber);font-size:1.1rem;line-height:1}
.fold.open{border-bottom:1px solid var(--line)}
.foldbody{padding:12px 13px}
.dossier{width:100%;display:block;cursor:zoom-in;border:1px solid var(--line)}
.hisimg{width:100%;display:block;margin-top:9px;cursor:zoom-in;border:1px solid var(--line)}
.linkcard{background:var(--panel);border:1px solid var(--amber-dim);
  border-left:3px solid var(--amber);padding:14px 15px;margin-top:18px;cursor:pointer;position:relative}
.linkcard:active{background:var(--panel2)}
.lc-t{font-size:1.05rem;font-weight:650;color:var(--amber);text-shadow:0 0 12px var(--glow)}
.lc-b{font-size:.8rem;color:var(--dim);margin-top:5px;line-height:1.5;padding-right:52px}
.lc-go{position:absolute;right:14px;bottom:13px;font-family:var(--mono);font-size:.78rem;color:var(--amber)}

/* loadout + inventory */
.slot2{padding:11px 13px;border-bottom:1px solid var(--line);position:relative}
.slot2:last-child{border-bottom:0}
.slot2.bare .sitem{color:var(--faint);font-style:italic}
.sname{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.sitem{font-weight:600;font-size:.95rem;margin-top:2px;padding-right:74px}
.sbits{font-family:var(--mono);font-size:.64rem;color:var(--good);margin-top:4px}
.ssp{font-size:.76rem;color:var(--dim);margin-top:6px;line-height:1.45}
.soff{position:absolute;top:11px;right:12px;padding:5px 10px;font-size:.68rem}
.inv{padding:11px 13px;border-bottom:1px solid var(--line)}
.inv:last-child{border-bottom:0}
.ihead{display:flex;align-items:center;gap:9px}
.irow{display:flex;gap:7px;margin-top:9px}
.irow button{flex:1;padding:8px}
button.warn{border-color:var(--hp);color:var(--hp)}
.form label{margin-top:10px}
.form label:first-child{margin-top:0}
.form select{font-family:var(--sans);font-size:.9rem;color:var(--text);background:var(--panel2);
  border:1px solid var(--line);padding:9px;width:100%}
.numgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.numgrid div{display:flex;flex-direction:column;gap:2px}
.numgrid span{font-size:.56rem;color:var(--faint);letter-spacing:.06em}
.numgrid input{padding:6px;font-size:.85rem;text-align:center}

/* potion slot */
.slot{display:flex;align-items:center;gap:11px;padding:10px 12px;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.slot .ix{font-family:var(--mono);color:var(--faint);font-size:.8rem;width:14px}
.slot .nm{font-size:.88rem}
.slot .ef{font-size:.7rem;color:var(--dim)}
.slot button{margin-left:auto;padding:6px 11px;font-size:.75rem;flex:0 0 auto}
.slot.used{opacity:.35}
.slot.used button{display:none}

/* tabs */
nav{flex:0 0 auto;display:flex;border-top:1px solid var(--line);background:var(--panel);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 2px 8px;color:var(--faint);
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.6rem}
nav button .ic{font-size:1.08rem;line-height:1}
nav button.on{color:var(--amber);text-shadow:0 0 10px var(--glow)}
nav button.on .ic{filter:drop-shadow(0 0 8px var(--glow))}

.note{font-size:.76rem;color:var(--faint);margin-top:8px;line-height:1.5}
.tag{display:inline-block;font-family:var(--mono);font-size:.62rem;color:var(--faint);
  border:1px solid var(--line);padding:1px 5px;margin-right:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><div id="app">
<header>
  <div class="who"><h1 id="cname">Ansel Mott</h1><span class="cls" id="ccls">Hacker</span>
    <span class="rank" id="crank">RANK 1</span>
    <button class="hbtn" id="palbtn" aria-label="Change palette">◑</button></div>
</header>
<main id="view"></main>
<div class="lb" id="lightbox"><img id="lbimg" alt=""></div>

function $(id){ return document.getElementById(id); }
function n(v){ return (typeof v==='number'&&isFinite(v))?v:0; }

/* ---- derived stats: rolled base + weapon + worn gear ---- */
function eq(slot){
  var id=S.equipped&&S.equipped[slot]; if(!id)return null;
  for(var i=0;i<S.inventory.length;i++) if(S.inventory[i].id===id) return S.inventory[i];
  return null;
}
function tot(){
  var g={hand:eq('hand'),armor:eq('armor'),helm:eq('helm'),
         boots:eq('boots'),gloves:eq('gloves'),accessory:eq('accessory')}, o={};
  var wStr=g.hand?n(g.hand.str):0, wMag=g.hand?n(g.hand.mag):0;
  o.STR=S.base.STR+wStr+(g.gloves?n(g.gloves.str):0)+(g.accessory?n(g.accessory.str):0);
  o.DEF=S.base.DEF+(g.armor?n(g.armor.def):0)+(g.helm?n(g.helm.def):0);
  o.MAG=S.base.MAG+wMag+(g.helm?n(g.helm.mag):0)+(g.accessory?n(g.accessory.mag):0);
  o.RES=S.base.RES+(g.armor?n(g.armor.res):0)+(g.helm?n(g.helm.res):0);
  o.FIN=S.base.FIN-(g.armor?n(g.armor.fin):0)+(g.boots?n(g.boots.fin):0)
        +(g.gloves?n(g.gloves.fin):0)+(g.accessory?n(g.accessory.fin):0);
  o.SPD=S.base.SPD-(g.armor?n(g.armor.spd):0)+(g.boots?n(g.boots.spd):0)
        +(g.gloves?n(g.gloves.spd):0)+(g.accessory?n(g.accessory.spd):0);
  o.LCK=S.base.LCK+(g.boots?n(g.boots.lck):0)+(g.accessory?n(g.accessory.lck):0);
  o.HPMAX=S.baseHP+(g.armor?n(g.armor.hp):0);
  o.MPMAX=S.baseMP+(g.helm?n(g.helm.mp):0);
  o.TPMAX=S.baseTP;
  o.POW=g.hand?n(g.hand.pow):0;
  o.ATK=o.STR+o.POW;
  o.CRIT=(g.gloves?n(g.gloves.crit):0)+(g.accessory?n(g.accessory.crit):0);
  return o;
}
function clamp(v){ return v<5?5:v>95?95:Math.round(v*10)/10; }

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function actRow(a,g,i){
  var unknown=(a.tp===null);
  var can=!unknown && S.tp>=a.tp && S.mp>=n(a.mp);
  var rb=0;
  if(a.strike&&S.runup) rb=Math.min(n(S.moved),S.runup.cap)*S.runup.sources.length;
  return '<div class="sk'+(can?'':' cant')+'" data-act="'+g+':'+i+'">'+
    '<div class="cost"><b>'+(unknown?'?':a.tp)+'</b><i>TP</i></div>'+
    '<div><div class="nm">'+esc(a.n)+'</div><div class="meta">'+esc(a.meta)+
      (n(a.mp)?' \u00b7 '+a.mp+' MP':'')+
      (rb?'<span class="runbonus">+'+rb+'</span>':'')+'</div></div>'+
    (a.tier!==undefined&&a.tier!==null?'<div class="tier">Tier '+a.tier+'</div>':'')+
    '</div>';
}

function vTurn(){
  var T=tot(), h='';
  var p='';
  for(var q=0;q<T.TPMAX;q++) p+='<div class="pip '+(q<S.tp?'on':'spent')+'"></div>';
  h+='<div class="trk tp">'+
       '<button class="minus" data-tp="-1" aria-label="Spend a turn point">\u2212</button>'+
       '<div class="mid">'+
         '<div class="lbl">Turn Points</div>'+
         '<div class="num">'+S.tp+'<small>/'+T.TPMAX+'</small></div>'+
         '<div class="pips">'+p+'</div>'+
       '</div>'+
       '<button class="plus" data-tp="1" aria-label="Regain a turn point">+</button>'+
     '</div>';
  h+='<div class="btn-row" style="margin-top:8px">'+
     '<button data-tp="reset">New Turn</button>'+
     '<button data-undo="1"'+(S.undo&&S.undo.length?'':' disabled style="opacity:.4"')+'>Undo</button></div>';

  if(S.runup){
    var mv=n(S.moved), per=Math.min(mv,S.runup.cap), bonus=per*S.runup.sources.length;
    h+='<div class="runup'+(bonus?' hot':'')+'">'+
       '<div class="ru-l">Squares moved this turn</div>'+
       '<div class="ru-n">'+mv+'</div>'+
       '<div class="ru-b">'+(bonus?'+'+bonus+' damage while it lasts':'move to build a bonus')+'</div>'+
       '<div class="ru-s">'+S.runup.sources.map(function(x){
          return '<span>'+esc(x)+' +'+per+'</span>'; }).join('')+'</div>'+
       '<button class="ru-x" data-resetmoved="1">Reset</button></div>';
  }
  if(S.turnStart){
    h+='<div class="tstart"><span>At the start of your turn</span><b>'+esc(S.turnStart)+'</b></div>';
  }
  h+='<h2>Class Actions</h2><div class="card">';
  S.acts.cls.forEach(function(a,i){ h+=actRow(a,'cls',i); });
  h+='</div>';
  h+='<h2>General Actions</h2><div class="card">';
  S.acts.gen.forEach(function(a,i){ h+=actRow(a,'gen',i); });
  h+='</div>';
  h+='<h2>Movement</h2><div class="card">';
  S.acts.mov.forEach(function(a,i){ h+=actRow(a,'mov',i); });
  h+='</div>';
  return h;
}

function initPad(){
  var c=document.getElementById('pad'); if(!c)return;
  var g=c.getContext('2d');
  if(S.padData){ var im=new Image(); im.onload=function(){g.drawImage(im,0,0)}; im.src=S.padData; }
  g.lineCap='round'; g.lineJoin='round'; g.lineWidth=3;
  var cs=getComputedStyle(document.documentElement);
  g.strokeStyle=cs.getPropertyValue('--text').trim()||'#fff';
  var drawing=false,lx=0,ly=0;
  function pos(e){
    var r=c.getBoundingClientRect();
    return {x:(e.clientX-r.left)*(c.width/r.width),y:(e.clientY-r.top)*(c.height/r.height)};
  }
  c.addEventListener('pointerdown',function(e){ e.preventDefault(); drawing=true; var p=pos(e); lx=p.x; ly=p.y; });
  c.addEventListener('pointermove',function(e){
    if(!drawing)return; e.preventDefault(); var p=pos(e);
    g.beginPath(); g.moveTo(lx,ly); g.lineTo(p.x,p.y); g.stroke(); lx=p.x; ly=p.y;
    S.padData=c.toDataURL('image/png');
  });
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){
    c.addEventListener(ev,function(){ drawing=false; });
  });
}

function backup(){
  save();
  var out={app:'ravel-companion',v:1,character:S.name,saved:new Date().toISOString()};
  LIVE.forEach(function(k){ out[k]=S[k]; });
  var txt=JSON.stringify(out,null,2);
  var name=(S.name||'character').replace(/\s+/g,' ').trim().replace(/ /g,'-')+'-backup.json';
  var blob=new Blob([txt],{type:'application/json'});
  try{
    var file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({title:S.name+' backup',files:[file]}).catch(function(){});
      return;
    }
  }catch(e){}
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url)},1000);
}
function wireNoteFile(){
  var fi=document.getElementById('notefile'); if(!fi||fi._wired)return;
  fi._wired=true;
  fi.addEventListener('change',function(){
    var f=fi.files&&fi.files[0]; if(!f)return;
    var rd=new FileReader();
    rd.onload=function(ev){
      shrink(ev.target.result,1400,function(url){
        S.entries.push({id:'n'+(S.nextId++),kind:'photo',
          title:f.name.replace(/\.[a-z0-9]+$/i,''),img:url,when:stamp()});
        try{ save(); }
        catch(err){ alert('That image was too large to store. Try a smaller one.');
                    S.entries.pop(); }
        render();
      });
    };
    rd.readAsDataURL(f);
    fi.value='';
  });
}
function shrink(dataUrl,maxPx,done){
  var im=new Image();
  im.onload=function(){
    var w2=im.width,h2=im.height,sc=Math.min(1,maxPx/Math.max(w2,h2));
    var c=document.createElement('canvas');
    c.width=Math.round(w2*sc); c.height=Math.round(h2*sc);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    try{ done(c.toDataURL('image/jpeg',0.72)); }
    catch(e){ done(dataUrl); }
  };
  im.onerror=function(){ done(dataUrl); };
  im.src=dataUrl;
}
function wireRestore(){
  var fi=document.getElementById('restorefile'); if(!fi||fi._wired)return;
  fi._wired=true;
  fi.addEventListener('change',function(){
    var f=fi.files&&fi.files[0]; if(!f)return;
    var rd=new FileReader();
    rd.onload=function(ev){
      var data;
      try{ data=JSON.parse(ev.target.result); }
      catch(err){ alert('That file is not readable JSON.'); return; }
      if(!data||data.app!=='ravel-companion'){
        alert('That does not look like a companion backup.'); return;
      }
      ask('Restore this backup?',
          'Saved '+(data.saved?new Date(data.saved).toLocaleString():'in an earlier session')+
          '. Everything currently on this device is replaced.','Restore',function(){
        LIVE.forEach(function(k){ if(data[k]!==undefined) S[k]=data[k]; });
        save(); applyTheme(S.theme||'rig'); TAB='stats'; render();
      });
    };
    rd.readAsText(f);
  });
}

    var t=THEMES[k];
    if(t.g!==grp){ grp=t.g; h+='<div class="palgrp">'+grp+'</div>'; }
    h+='<button class="pal'+(S.theme===k?' on':'')+'" data-pal="'+k+'">'+
       '<span class="strip">'+
         '<i style="background:'+t.v['--bg']+'"></i>'+
         '<i style="background:'+t.v['--panel2']+'"></i>'+
         '<i style="background:'+t.v['--amber']+'"></i>'+
         '<i style="background:'+t.v['--cold']+'"></i>'+
       '</span>'+
       '<span class="pn">'+esc(t.n)+'</span>'+
       '<span class="tone">'+t.t+'</span>'+
       (S.theme===k?'<span class="tick">\u2713</span>':'')+'</button>';
  }
  $('pallist').innerHTML=h;
}
function render(){
  paintPalettes();
  var v={turn:vTurn,stats:vStats,skills:vSkills,gear:vGear,codex:vCodex,notes:vNotes}[TAB];
  $('view').innerHTML=v();
  head();
  if(TAB==='notes'){ initPad(); wireNoteFile(); }
  if(TAB==='stats') wireRestore();
  $('tabs').innerHTML=TABS.map(function(t){
    return '<button data-tab="'+t[0]+'" class="'+(TAB===t[0]?'on':'')+'">'+
           '<span class="ic">'+t[1]+'</span>'+t[2]+'</button>'; }).join('');
  save();
}

document.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-tab],[data-tp],[data-rest],[data-use],[data-open-codex],[data-pal],[data-act],[data-undo],[data-adj],[data-resetmoved],[data-uneq],[data-eqp],[data-delitem],[data-delcon],[data-form],[data-additem],[data-addcon],[data-zoom],[data-zoomsrc],[data-fold],[data-newnote],[data-savenote],[data-savedraw],[data-clearpad],[data-delnote],[data-backup],[data-restore],[data-pickimg],#cfmyes,#cfmno,#cfmovl,#lightbox,#paldone,#palbtn,#palovl'):null;
  if(!el)return;
  if(el.id==='cfmyes'){ var f=CFM; closeAsk(); if(f)f(); return; }
  if(el.id==='cfmno'||el.id==='cfmovl'){ closeAsk(); return; }
  if(el.id==='lightbox'){ el.classList.remove('open'); return; }
  if(el.dataset&&el.dataset.zoom){ $('lbimg').src=IMG[el.dataset.zoom]; $('lightbox').classList.add('open'); return; }
  if(el.id==='palbtn'){ $('palovl').classList.add('open'); return; }
  if(el.id==='palovl'||el.id==='paldone'){ $('palovl').classList.remove('open'); return; }
  var d=el.dataset, T=tot();
  if(d.tab){ TAB=d.tab; OPEN=-1; render(); return; }
  if(d.act){
    var bits=d.act.split(':'), a=S.acts[bits[0]][+bits[1]];
    if(a.n==='Change Loadout') a.tp=T.TPMAX;
    if(a.tp===null) return;
    if(S.tp>=a.tp && S.mp>=n(a.mp)){
      S.tp-=a.tp; S.mp-=n(a.mp);
      if(a.moves){ S.moved=n(S.moved)+a.moves; }
      S.undo=S.undo||[]; S.undo.push({tp:a.tp,mp:n(a.mp),moves:a.moves||0});
      render();
    }
    return;
  }
  if(d.adj){
    var bits2=d.adj.split(':'), key=bits2[0], sign=+bits2[1];
    var amt=1;
    S[key]=Math.max(0,S[key]+sign*amt);
    render(); return;
  }
  if(d.resetmoved){ S.moved=0; render(); return; }
  if(d.undo){
    if(S.undo&&S.undo.length){ var u=S.undo.pop();
      S.tp=Math.min(T.TPMAX,S.tp+u.tp); S.mp=Math.min(T.MPMAX,S.mp+u.mp);
      if(u.moves) S.moved=Math.max(0,n(S.moved)-u.moves);
      render(); }
    return;
  }
  if(d.tp!==undefined){
    if(d.tp==='reset'){ S.tp=T.TPMAX; S.undo=[]; S.moved=0; }
    else S.tp=Math.max(0,Math.min(T.TPMAX,S.tp+ +d.tp));
    render(); return;
  }
  if(d.hp!==undefined){ S.hp=Math.max(0,Math.min(T.HPMAX,S.hp+ +d.hp)); render(); return; }
  if(d.mp!==undefined){ S.mp=Math.max(0,Math.min(T.MPMAX,S.mp+ +d.mp)); render(); return; }
  if(d.rest){ S.hp=T.HPMAX; S.mp=T.MPMAX; S.tp=T.TPMAX; render(); return; }
  if(d.open!==undefined){ OPEN = (OPEN===+d.open?-1:+d.open); render(); return; }
  if(d.use){
    for(var ci=0;ci<S.consumables.length;ci++){
      var p=S.consumables[ci];
      if(p.id!==d.use) continue;
      if(/\+(\d+) HP/.test(p.e)) S.hp=S.hp+ +RegExp.$1;
      if(/\+(\d+) MP/.test(p.e)) S.mp=S.mp+ +RegExp.$1;
      S.consumables.splice(ci,1);      /* used up, not reusable */
      break;
    }
    render(); return;
  }
  if(d.uneq){ S.equipped[d.uneq]=null; render(); return; }
  if(d.eqp){
    for(var ii=0;ii<S.inventory.length;ii++){
      if(S.inventory[ii].id===d.eqp){ S.equipped[S.inventory[ii].slot]=d.eqp; break; }
    }
    render(); return;
  }
  if(d.delitem){
    var gone=S.inventory.filter(function(x){return x.id===d.delitem})[0];
    ask('Discard '+(gone?gone.n:'item')+'?','It comes off your sheet for good. You would have to add it again by hand.',
      'Discard',function(){
        for(var k2 in S.equipped) if(S.equipped[k2]===d.delitem) S.equipped[k2]=null;
        S.inventory=S.inventory.filter(function(x){return x.id!==d.delitem});
        render();
      });
    return;
  }
  if(d.delcon){
    var gc=S.consumables.filter(function(x){return x.id===d.delcon})[0];
    ask('Discard '+(gc?gc.n:'consumable')+'?','Thrown away without using it.','Discard',function(){
      S.consumables=S.consumables.filter(function(x){return x.id!==d.delcon});
      render();
    });
    return;
  }
  if(d.form!==undefined){ S.form=d.form||null; S.draft={}; render(); return; }
  if(d.additem){
    var f=S.draft||{};
    if(!f.n){ return; }
    var it={id:'i'+(S.nextId++),n:f.n,d:f.d||'',slot:f.slot||'hand'};
    ['pow','str','def','mag','res','fin','spd','lck','hp','mp','crit'].forEach(function(k3){
      if(f[k3]!==undefined&&f[k3]!=='') it[k3]=+f[k3];
    });
    if(f.dmg) it.dmg=f.dmg;
    if(f.sp) it.sp=f.sp;
    S.inventory.push(it); S.form=null; S.draft={}; render(); return;
  }
  if(d.addcon){
    var c=S.draft||{};
    if(!c.n){ return; }
    S.consumables.push({id:'c'+(S.nextId++),n:c.n,e:c.e||''});
    S.form=null; S.draft={}; render(); return;
  }
  if(d.pickimg){ var nf=$('notefile'); if(nf) nf.click(); return; }
  if(d.backup){ backup(); return; }
  if(d.restore){ var fi=$('restorefile'); if(fi) fi.click(); return; }
  if(d.newnote!==undefined){ S.compose=d.newnote||null; S.draft={}; S.padData=null; render(); return; }
  if(d.savenote){
    var f2=S.draft||{};
    if(f2.title||f2.body){
      S.entries.push({id:'n'+(S.nextId++),kind:'text',title:f2.title||'',body:f2.body||'',when:stamp()});
    }
    S.compose=null; S.draft={}; render(); return;
  }
  if(d.savedraw){
    var cv=$('pad');
    if(cv){ S.entries.push({id:'n'+(S.nextId++),kind:'draw',
      title:(S.draft||{}).title||'',img:cv.toDataURL('image/png'),when:stamp()}); }
    S.compose=null; S.draft={}; S.padData=null; render(); return;
  }
  if(d.clearpad){ S.padData=null; var cv2=$('pad');
    if(cv2){ cv2.getContext('2d').clearRect(0,0,cv2.width,cv2.height); } return; }
  if(d.delnote){
    var nn=S.entries.filter(function(x){return x.id===d.delnote})[0];
    ask('Delete \u201c'+((nn&&nn.title)||'Untitled')+'\u201d?','This note cannot be recovered.','Delete',
      function(){ S.entries=S.entries.filter(function(x){return x.id!==d.delnote}); render(); });
    return;
  }
  if(d.zoomsrc){
    var hit=S.entries.filter(function(x){return x.id===d.zoomsrc})[0];
    if(hit){ $('lbimg').src=hit.img; $('lightbox').classList.add('open'); }
    return;
  }
  if(d.fold){ S[d.fold]=!S[d.fold]; render(); return; }
  if(d.pal){ S.theme=d.pal; applyTheme(d.pal); render(); $('palovl').classList.add('open'); return; }
  if(d.openCodex){ window.open('https://paddysalocin.github.io/Aurelion/Codex%20-%20Aurelion.html','_blank'); return; }

});

document.addEventListener('input',function(e){
  var d=e.target.dataset; if(!d)return;
  if(d.set){
    var T2=tot(), v=e.target.value===''?0:+e.target.value;
    var cap=d.set==='hp'?T2.HPMAX:T2.MPMAX;
    S[d.set]=Math.max(0,Math.min(cap,v)); save();
    var wrap=e.target.parentNode;
    var bar=wrap.querySelector('.bar i'); if(bar) bar.style.width=(cap?S[d.set]/cap*100:0)+'%';
    var num=wrap.querySelector('.n');
    if(num) num.innerHTML=S[d.set]+'<small style="color:var(--faint)">/'+cap+'</small>';
    return;
  }
  if(d.df!==undefined){ S.draft=S.draft||{}; S.draft[d.df]=e.target.value; save(); return; }
  if(d.xp){ S.xp= e.target.value===''?0:+e.target.value; save(); return; }
  if(d.cred){ S.credits= e.target.value===''?0:+e.target.value; save(); return; }
  if(d.notes){ S.notes=e.target.value; save(); return; }
});

render();
</script></body></html>
